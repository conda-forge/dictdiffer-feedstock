{% set name = "dictdiffer" %}
{% set version = "0.10.0" %}
{% set sha256 = "0b912acf663949d73b820d3ed59362140a188ab742c94efe13c762dbd24cbbd3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vvv '

requirements:
  host:
    - pip
    - python {{ python_min }}
    - pytest-runner >=2.7
    - setuptools
    - setuptools-scm >=3.1
  run:
    - python >={{ python_min }}

test:
  requires:
    - setuptools
    - python {{ python_min }}
  imports:
    - dictdiffer

about:
  home: https://github.com/inveniosoftware/dictdiffer
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Dictdiffer is a library that helps you to diff and patch dictionaries.
  doc_url: https://dictdiffer.readthedocs.io
  dev_url: https://github.com/inveniosoftware/dictdiffer

extra:
  recipe-maintainers:
    - hodgsonw
    - kmuehlbauer
    - maresb
